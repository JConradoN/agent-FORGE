name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: [self-hosted, fox-server, turboquant]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: http://192.168.88.200:8082/v1
          OPENAI_COMPATIBLE_API_KEY: not-needed
          OPENWIKI_MODEL_ID: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
          LANGCHAIN_TRACING_V2: "false"

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: openwiki
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
