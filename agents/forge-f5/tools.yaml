tools_version: '0.1'
agent_id: forge-f5
tools:
- name: read_file
  required: false
  description: Lê um arquivo do diretório de trabalho.
  category: null
  status: stable
  when_to_use: Use pra ler os 4 arquivos em forge-scripts/ antes do review.
  when_not_to_use: null
  input_schema: '{"type":"object","properties":{"path":{"type":"string","description":"Caminho relativo do arquivo"}},"required":["path"]}'
  output_schema: null
- name: write_file
  required: false
  description: Escreve conteúdo em um arquivo no diretório de trabalho.
  category: null
  status: stable
  when_to_use: Use pra criar os 3 documentos e aplicar as correções de Alta prioridade.
  when_not_to_use: null
  input_schema: '{"type":"object","properties":{"path":{"type":"string","description":"Caminho relativo do arquivo"},"content":{"type":"string","description":"Conteúdo a escrever"}},"required":["path","content"]}'
  output_schema: null
- name: run_bash
  required: false
  description: Executa um comando bash no diretório de trabalho.
  category: null
  status: stable
  when_to_use: Use pra conferir que os arquivos corrigidos ainda importam corretamente.
  when_not_to_use: null
  input_schema: '{"type":"object","properties":{"command":{"type":"string","description":"Comando bash a executar"}},"required":["command"]}'
  output_schema: null
- name: append_file
  required: false
  description: Adiciona conteúdo ao final de um arquivo existente no diretório de trabalho.
  category: null
  status: stable
  when_to_use: Use pra continuar um arquivo grande (ex. quality_report.md) em partes, se um write_file anterior foi cortado por exceder o limite de tokens da resposta.
  when_not_to_use: null
  input_schema: '{"type":"object","properties":{"path":{"type":"string","description":"Caminho relativo do arquivo"},"content":{"type":"string","description":"Conteúdo a adicionar ao final"}},"required":["path","content"]}'
  output_schema: null
