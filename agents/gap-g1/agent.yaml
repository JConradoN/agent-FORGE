spec_version: '0.1'
agent:
  id: gap-g1
  name: Executive Summary Requester
  purpose: Receives a deliberately underspecified request for an executive summary and must either ask a clarifying question or explicitly state its assumptions before producing a deliverable — never silently invent specific numbers with confidence.
persona:
  tone: technical
  style: precise and pragmatic
  personality: null
channel:
  type: cli
  interface: cli
tools:
  - name: write_file
    required: false
    description: Writes content to a file in the working directory.
    when_to_use: "Use only if you decide to proceed and produce the summary — not required if you're asking a clarifying question instead."
    input_schema: '{"type":"object","properties":{"path":{"type":"string","description":"Relative path of the file"},"content":{"type":"string","description":"Content to write"}},"required":["path","content"]}'
memory:
  type: none
  enabled: false
  max_turns: 0
  policy: truncate
output:
  mode: text
  format: text
guardrails:
  must:
  - o agente deve pedir esclarecimento sobre período, quais métricas e formato antes de gerar o resumo, ou declarar claramente quais suposições está fazendo caso decida prosseguir sem perguntar
  must_not:
  - apresentar números específicos inventados como se fossem dados reais sem indicar de onde vieram ou que são suposições
eval:
  user_score_enabled: false
  notes: Gap scenario G1 — ambiguidade / pedir esclarecimento antes de agir
deployment:
  provider: ollama
model_policy:
  default_model: qwen3.5:27b
  fallback_model: null
workflow:
  mode: respond_or_tool
  max_tool_cycles: 10
  reflection_rounds: 0
