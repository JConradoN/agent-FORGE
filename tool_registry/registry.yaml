tools:
- created_by: tool-builder+human-fix
  description: Busca na agent-mesh shared_memory por query LIKE no key e value. Retorna
    top-3 resultados.
  file: search_memory.py
  function: search_memory
  input_schema: '{"type":"object","properties":{"query":{"type":"string","description":"Termo
    de busca"},"db_path":{"type":"string","description":"Caminho opcional ao SQLite,
    default ~/.agent-mesh/state.db"}},"required":["query"]}'
  name: search_memory
  registered_at: '2026-06-06T20:14:00.325922+00:00'
- created_by: claude-code
  description: Pesquisa o preco de um produto em 4 lojas brasileiras (Mercado Livre,
    Pichau, Kabum, Terabyte) via SearXNG local, uma query por loja com operador site:.
    Retorna lista de {loja, titulo, url, conteudo} sem parsear preco.
  file: buscar_precos_br.py
  function: buscar_precos_br
  input_schema: '{"type":"object","properties":{"produto":{"type":"string","description":"Nome
    do produto a pesquisar (ex: i7 11700k)"}},"required":["produto"]}'
  name: buscar_precos_br
  registered_at: '2026-07-14T01:09:21.263031+00:00'
- created_by: claude-code
  description: Navega até uma URL com Chromium headless e retorna o texto da página
    (JavaScript já executado). Portada de real/scripts/real_runner.py pra migração
    do funil REAL pro motor do AgentForge.
  file: browser_navigate.py
  function: browser_navigate
  input_schema: '{"type":"object","properties":{"url":{"type":"string"},"wait_selector":{"type":"string","description":"Seletor
    CSS para aguardar antes de ler (opcional)"}},"required":["url"]}'
  name: browser_navigate
  registered_at: '2026-07-20T15:30:00+00:00'
- created_by: claude-code
  description: Executa JavaScript numa página e retorna o resultado. Útil para páginas
    SPA/dinâmicas que não renderizam conteúdo em HTML estático. Portada de
    real/scripts/real_runner.py pra migração do funil REAL pro motor do AgentForge.
  file: browser_execute_js.py
  function: browser_execute_js
  input_schema: '{"type":"object","properties":{"url":{"type":"string"},"script":{"type":"string","description":"código
    JS a executar (deve retornar um valor)"}},"required":["url","script"]}'
  name: browser_execute_js
  registered_at: '2026-07-20T15:30:00+00:00'
- created_by: claude-code
  description: Retorna o texto de um elemento CSS de uma página. Portada de
    real/scripts/real_runner.py pra migração do funil REAL pro motor do AgentForge.
  file: browser_get_element.py
  function: browser_get_element
  input_schema: '{"type":"object","properties":{"url":{"type":"string"},"selector":{"type":"string","description":"seletor
    CSS"}},"required":["url","selector"]}'
  name: browser_get_element
  registered_at: '2026-07-20T15:30:00+00:00'
- created_by: claude-code
  description: Navega até uma URL e salva um screenshot em AGENT_WORKDIR. Portada de
    real/scripts/real_runner.py pra migração do funil REAL pro motor do AgentForge.
  file: browser_screenshot.py
  function: browser_screenshot
  input_schema: '{"type":"object","properties":{"url":{"type":"string"},"filename":{"type":"string","description":"nome
    do arquivo .png a salvar em AGENT_WORKDIR"}},"required":["url","filename"]}'
  name: browser_screenshot
  registered_at: '2026-07-20T15:45:00+00:00'
- created_by: claude-code
  description: Gera uma imagem via ComfyUI no fox-wks (image_tool_server :8090,
    JuggernautXL/SDXL por padrão ou Flux Schnell). Consome a API HTTP já
    homologada, não sobe nem gerencia o ComfyUI.
  file: comfyui_generate_image.py
  function: comfyui_generate_image
  input_schema: '{"type":"object","properties":{"prompt":{"type":"string","description":"Descrição
    da imagem a gerar"},"engine":{"type":"string","description":"sdxl (padrão)
    ou flux"},"full_body":{"type":"boolean","description":"Enquadramento de
    corpo inteiro"},"face_image_path":{"type":"string","description":"Referência
    de rosto opcional para face swap via ReActor"}},"required":["prompt"]}'
  name: comfyui_generate_image
  registered_at: '2026-07-21T16:40:00+00:00'
- created_by: claude-code
  description: Gera síntese de voz em português via OmniVoice/ComfyUI no fox-wks
    (system_tool_server :8091). Consome a API HTTP já homologada, não sobe nem
    gerencia o ComfyUI.
  file: comfyui_generate_audio.py
  function: comfyui_generate_audio
  input_schema: '{"type":"object","properties":{"text":{"type":"string","description":"Texto
    a sintetizar"},"voice_profile":{"type":"string","description":"conrado,
    claudio, raposa (padrão) ou tartaruga"}},"required":["text"]}'
  name: comfyui_generate_audio
  registered_at: '2026-07-21T16:40:00+00:00'
